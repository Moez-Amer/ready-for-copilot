name: "Issue Triage Report"
description: "Generates a static report on how issues are being triaged and whether the rubric predicts anything."
inputs:
  github-token:
    description: "Token used to read issues."
    required: false
    default: ${{ github.token }}
  output:
    description: "Where to write the generated HTML."
    required: false
    default: "public/index.html"
runs:
  using: "node24"
  main: "dist/index.cjs"
