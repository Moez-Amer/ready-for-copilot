name: Issue Readiness

on:
  issues:
    # Re-score after an edit so acting on the feedback updates the verdict.
    types: [opened, edited]

permissions:
  issues: write
  # Required to read the file tree for grounding. Declaring any
  # permissions block defaults every unlisted scope to none.
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/readiness
        with:
          aws-bearer-token-bedrock: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          aws-region: us-east-1
