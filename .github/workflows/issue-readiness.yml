name: Issue Readiness

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/readiness
        with:
          aws-bearer-token-bedrock: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          aws-region: us-east-1
